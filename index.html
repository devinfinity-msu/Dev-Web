<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev Infinity — Loading</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:ital,wght@0,400;0,500;1,400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="field"></div>

    <div class="ambient-orbs">
        <span class="orb orb-1"></span>
        <span class="orb orb-2"></span>
        <span class="orb orb-3"></span>
    </div>

    <div class="intro-overlay" aria-hidden="true">
        <span class="ripple-ring r1"></span>
        <span class="ripple-ring r2"></span>
        <span class="ripple-ring r3"></span>
        <div class="impact-flash"></div>
        <div class="splash-blob"></div>
        <svg class="drop-svg" viewBox="0 0 40 54" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="dropGradient" x1="15%" y1="0%" x2="85%" y2="100%">
                    <stop offset="0%" stop-color="#22d3ee" />
                    <stop offset="55%" stop-color="#8b5cf6" />
                    <stop offset="100%" stop-color="#4338ca" />
                </linearGradient>
            </defs>
            <path class="drop-body" d="M20 1.5
               C20 1.5 3.5 24.5 3.5 36.5
               C3.5 46.16 10.94 53 20 53
               C29.06 53 36.5 46.16 36.5 36.5
               C36.5 24.5 20 1.5 20 1.5 Z" fill="url(#dropGradient)" />
            <ellipse class="drop-highlight" cx="14.5" cy="21" rx="3.6" ry="7.2" fill="#ffffff" opacity="0.5" />
            <ellipse class="drop-highlight-sm" cx="24" cy="16" rx="1.3" ry="2" fill="#ffffff" opacity="0.35" />
        </svg>
    </div>

    <main class="stage" id="stage">

        <div class="logo-wrap" id="logoWrap">
            <span class="sonar s1"></span>
            <span class="sonar s2"></span>
            <span class="sonar s3"></span>
            <div class="logo-glow"></div>
            <img class="logo-img" src="dev logo.png" alt="Dev Infinity logo">
        </div>

        <h1 class="wordmark"><span class="dev">Dev</span> <span class="infinity">Infinity</span></h1>

        <p class="tagline typing" id="tagline"></p>

        <div class="loop-wrap">
            <svg class="loop" viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="loopGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#e8c15c" />
                        <stop offset="50%" stop-color="#7fe8bd" />
                        <stop offset="100%" stop-color="#f2896a" />
                    </linearGradient>
                </defs>
                <path id="track" class="track"
                    d="M 30 50 C 30 25, 70 25, 100 50 C 130 75, 170 75, 170 50 C 170 25, 130 25, 100 50 C 70 75, 30 75, 30 50 Z" />
                <path id="progress" class="progress"
                    d="M 30 50 C 30 25, 70 25, 100 50 C 130 75, 170 75, 170 50 C 170 25, 130 25, 100 50 C 70 75, 30 75, 30 50 Z" />
                <circle id="comet" class="comet" r="3.4" fill="#ffffff" />
            </svg>
        </div>

        <div class="status-row">
            <span class="msg" id="statusMsg">Booting the club</span>
            <span class="pct" id="pct">0%</span>
        </div>

    </main>

    <script src="script.js"></script>
</body>

</html>
